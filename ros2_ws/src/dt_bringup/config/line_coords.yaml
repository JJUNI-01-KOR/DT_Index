# 라인 좌표표 (ROS 좌표, m · rad). 이 파일이 원본이다.
# 기준: SRS v3.1 6장 "라인 좌표표". 2026.11.02까지 확정, 바꾸려면 4명 합의. 정리 담당 D.
#
# 사용법
# - 형식: 이름: {x, y, z, yaw}. Unity에서 잰 위치를 CoordConverter(To<FLU>)로 바꾼 값을 넣는다.
#   변환: ROS x = Unity z, ROS y = -Unity x, ROS z = Unity y
# - 0.0은 "아직 안 채움"이다. 값을 비우면(null) factory_manager가 읽다가 멈추므로 숫자로 둔다.
# - 이름은 코드가 그대로 읽는다. 바꾸려면 읽는 노드(괄호 안)와 같은 PR에서 바꾼다.
# - 목록([])은 factory_manager의 load_poses가 건너뛴다. 칸이 여러 개인 곳에 쓴다.
# - 2026.10.30 Unity Main 씬 값으로 채움 (괄호 안은 Unity x, y, z)

# ── 투입 (로봇팔1, A) ──
bin_slots:                    # 적재함 칸 20개. 칸 순서대로 목록. 지금은 1번 칸만 (Unity 0.7, 0, 2.6)
  - {x: 2.600, y: -0.700, z: 0.000, yaw: 0.0}
feed_point:      {x: -0.500, y: -1.500, z: 0.625, yaw: 0.0}   # 팔1이 컨베이어에 놓는 위치 = 팔1 place_pose (factory_manager.feed). Unity (1.5, 0.625, -0.5). z = 벨트 윗면(Line 1 콜라이더 최고점)

# ── 검사·분기 (B) ── 코드가 읽지 않는 기록용
scale_1:         {x: -0.500, y: 4.500, z: 0.625, yaw: 0.0}    # 무게 센서 구간 중심. Unity (-4.5, 0.625, -0.5)
diverter_1:      {x: -0.500, y: 5.500, z: 0.625, yaw: 0.0}    # 분기 게이트. Unity (-5.5, 0.625, -0.5). 무게 센서와 1.0 m

# ── 레인 끝 집는 자리 (A) ── palletizer가 읽음. LaneEnd가 방석을 1번 칸에 놓는 자리 (z = 방석 바닥 = 칸 판 윗면 0.111)
pick_ok:         {x: -6.876, y: 15.500, z: 0.111, yaw: 0.0}   # 정상 레인 집는 자리 = 1번 칸. 팔2 pick_pose (palletizer_1). Unity BufferZoneSensor 2/BufferZone1 (-15.5, 0.108, -6.876). 대기 자리 BufferZone2 (-15.497, 0.107, -6.184)
pick_ng:         {x: 5.124, y: 15.500, z: 0.111, yaw: 0.0}    # 불량 레인 집는 자리 = 1번 칸. 팔3 pick_pose (palletizer_2). Unity BufferZoneSensor/BufferZone1 (-15.5, 0.108, 5.124). 대기 자리 BufferZone2 (-15.497, 0.107, 5.816)

# ── 로봇팔 베이스 (팔1 A, 팔2 B, 팔3 D) ── 기록용
arm_1_base:      {x: -0.500, y: -3.250, z: 0.000, yaw: 0.0}   # Unity (3.25, 0, -0.5)
arm_2_base:      {x: -6.500, y: 16.500, z: 0.000, yaw: 0.0}   # Unity (-16.5, 0, -6.5)
arm_3_base:      {x: 5.300, y: 16.750, z: 0.700, yaw: 0.0}    # Unity (-16.75, 0.7, 5.3). 받침대 0.7 m 위 (10/31, 파레트 5단까지 닿는 자리)

# ── 파레트 자리 (D). z는 파레트 상면. k단 놓기 = 상면 + (k-1) × 방석 높이 (palletizer) ──
pallet_1:        {x: -6.500, y: 18.000, z: 0.100, yaw: 0.0}   # 정상 (팔2 옆). Unity Pallet_Pass1 (-18, 0.1, -6.5). 지금 메시는 두께 0인 1 m 판이라 상면 = 0.1 (에셋 바꾸면 다시)
pallet_2:        {x: 5.400, y: 18.000, z: 0.100, yaw: 0.0}    # 불량 (팔3 옆). Unity Pallet_Fail1 (-18, 0.1, 5.4)

# ── 예비 파레트 자리 (D). 파레트1은 바깥쪽(-Z), 파레트2는 바깥쪽(+Z) 레일 ── 기록용
spare_1:         {x: -8.500, y: 18.000, z: 0.100, yaw: 0.0}   # Unity Pallet_Pass2 (-18, 0.1, -8.5)
spare_2:         {x: 7.400, y: 18.000, z: 0.100, yaw: 0.0}    # Unity Pallet_Fail2 (-18, 0.1, 7.4)

# ── 최종 구역 (D). AGV1 웨이포인트는 agv_waypoints.yaml ── 기록용
final_zone:      {x: -0.750, y: 22.000, z: 0.100, yaw: 0.0}   # 파레트가 내려지는 곳. AGV가 FINAL(Unity x -23)에서 -X를 보고 서면 파레트는 1 m 뒤 Unity (-22, 0.1, -0.75)
