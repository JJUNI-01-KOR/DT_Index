# 라인 좌표표 (ROS 좌표, 단위 m · rad). 원본 표: docs/line_coords.md
# 바꾸려면 4명 합의 (SRS 6장). Unity 값은 주석으로 남긴다.
# 변환: ROS x = Unity z, ROS y = -Unity x, ROS z = Unity y, ROS yaw = -(Unity Y회전) rad
# ⚠ 전부 임시값 (10/29). 실제 모델·오브젝트를 배치하면서 고친다.
frame_id: map

arm_1_base:      {x: 2.0,  y: -7.5,  z: 0.5, yaw: 0.0}              # Unity (7.5, 0.5, 2)
arm_2_base:      {x: 0.2,  y: -0.75, z: 0.5, yaw: 0.0}              # Unity (0.75, 0.5, 0.2)
arm_3_base:      {x: 2.0,  y: 6.8,   z: 0.5, yaw: 0.0}              # Unity (-6.8, 0.5, 2)
arm_4_base:      {x: -2.3, y: 0.85,  z: 0.5, yaw: 0.0}              # Unity (-0.85, 0.5, -2.3)

feed_point:      {x: 2.0,  y: -6.25, z: 0.5, yaw: 0.0}              # Unity (6.25, 0.5, 2)
size_gate:       {x: 2.0,  y: -0.5,  z: 0.5, yaw: 0.0}              # Unity (0.5, 0.5, 2)
reject_slot:     {x: 1.0,  y: -0.5,  z: 0.5, yaw: 0.0}              # Unity (0.5, 0.5, 1)
end_slot_1:      {x: 1.8,  y: 6.0,   z: 0.3, yaw: 0.0}              # Unity (-6, 0.3, 1.8)
end_slot_2:      {x: 2.3,  y: 6.0,   z: 0.3, yaw: 0.0}              # Unity (-6, 0.3, 2.3)

agv_load_stop:   {x: 0.5,  y: 6.8,   z: 0.0, yaw: 3.142}  # Unity (-6.8, 0.5, 0.5), Y회전 180°. AGV는 평면 이동이라 z=0
agv_unload_stop: {x: -3.38, y: 0.7,  z: 0.0, yaw: 0.0}    # Unity (-0.7, 0.5, -3.38). yaw 미정

pallet_1_origin: {x: 0.2,  y: -2.2,  z: 0.0, yaw: 0.0}    # Unity (2.2, 0, 0.2) 불량 팔레트 중심, factory_manager가 12칸 계산
pallet_2_origin: {x: -2.3, y: -0.4,  z: 0.0, yaw: 0.0}    # Unity (0.4, 0, -2.3) 출고 팔레트 중심, palletizer가 12칸 계산

