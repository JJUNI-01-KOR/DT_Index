# AGV1 웨이포인트 (ROS 좌표, m · rad). 담당 C(경로) · D(Unity 주행). SRS v3.1 부록 A.6
#
# 사용법
# - 경로는 일방통행 루프다: 대기(HOME) → 도킹(P1_DOCK·P2_DOCK) → 최종 구역(FINAL) → 바깥 레인 → 대기.
# - 정지 지점 4곳은 /agv_1_cmd 값과 같은 이름이다. agv_1_controller가 /agv_1_goal의 wp로 보낸다.
# - 경로점(route)은 정지 지점 사이를 지나는 순서대로 {x, y, yaw}를 적는다. 비어 있으면 바로 다음 정지 지점으로 간다.
# - 0.0은 "아직 안 채움"이다. 좌표는 line_coords.yaml과 같은 기준(4명 합의)으로 채운다.

stops:
  HOME:    {x: 0.0, y: 0.0, yaw: 0.0}   # 대기 위치 (파레트1·2 앞쪽 중간)
  P1_DOCK: {x: 0.0, y: 0.0, yaw: 0.0}   # 파레트1 도킹 위치 (연결)
  P2_DOCK: {x: 0.0, y: 0.0, yaw: 0.0}   # 파레트2 도킹 위치 (연결)
  FINAL:   {x: 0.0, y: 0.0, yaw: 0.0}   # 최종 구역 (분리, 3초 뒤 삭제)

route:
  to_p1_dock: []   # 출동: HOME → 파레트 자리 오른쪽 → P1_DOCK
  to_p2_dock: []   # 출동: HOME → 파레트 자리 오른쪽 → P2_DOCK
  to_final: []     # 견인: 도킹 위치 → 오른쪽으로 빠져 → FINAL
  to_home: []      # 복귀: FINAL → 바깥 레인 → HOME
