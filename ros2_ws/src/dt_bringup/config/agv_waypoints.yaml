# AGV1 웨이포인트 (ROS 좌표, m · rad). 담당 C(경로) · D(Unity 주행). SRS v3.1 부록 A.6
#
# 사용법
# - 경로는 일방통행 루프다: 대기(HOME) → 도킹(P1_DOCK·P2_DOCK) → 최종 구역(FINAL) → 바깥 레인 → 대기.
# - 정지 지점 4곳은 /agv_1_cmd 값과 같은 이름이다. agv_1_controller가 /agv_1_goal의 wp로 보낸다.
# - 경로점(route)은 정지 지점 사이를 지나는 순서대로 {x, y, yaw}를 적는다. 비어 있으면 바로 다음 정지 지점으로 간다.
# - 변환: ROS x = Unity z, ROS y = -Unity x. yaw 1.571 = Unity -X를 봄, -1.571 = Unity +X를 봄, 0.0 = Unity +Z를 봄
# - 2026.10.30 Unity Main 씬 값으로 채움 (괄호 안은 Unity x, z)

stops:
  HOME:    {x: -0.750, y: 16.500, yaw: -1.571}  # 대기 위치 (파레트1·2 앞쪽 중간). Unity AGV1 (-16.5, -0.75). 복귀해 온 방향(+X)을 보고 섬
  P1_DOCK: {x: -6.500, y: 19.000, yaw: 1.571}   # 파레트1 도킹. Unity P1_Doke (-19, -6.5). -X를 봐야 뒤(+X)의 파레트(-18)와 연결됨
  P2_DOCK: {x: 5.400, y: 19.000, yaw: 1.571}    # 파레트2 도킹. Unity P2_Doke (-19, 5.4). 위와 같음
  FINAL:   {x: -0.750, y: 23.000, yaw: 1.571}   # 최종 구역에서 분리. Unity FINAL (-23, -0.75). 파레트는 뒤쪽 Unity x -22에 놓임

route:
  to_p1_dock:                                   # 출동: HOME → 가운데 줄 x -19까지 → 그대로 -Z로 내려가 P1_DOCK (파레트 모서리 안 스침)
    - {x: -0.750, y: 19.000, yaw: 0.0}          # Unity (-19, -0.75)
  to_p2_dock:                                   # 출동: HOME → 가운데 줄 x -19까지 → 그대로 +Z로 올라가 P2_DOCK
    - {x: -0.750, y: 19.000, yaw: 0.0}          # Unity (-19, -0.75)
  to_final: []     # 견인: 도킹 위치 → FINAL 직선. 출발할 때 제자리 회전으로 파레트가 휘둘리면 경로점 추가
  to_home: []      # 복귀: FINAL → HOME 직선. ⚠ 방금 내려놓은 파레트(뒤쪽 x -22)를 지나가므로 옆으로 비켜 가는 경로점 필요할 수 있음
